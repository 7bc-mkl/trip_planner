[project]
name = "trip-planner"
version = "0.1.0"
description = "Smart Trip Planner — backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
]

[project.scripts]
trip-planner = "trip_planner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=0.29",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trip_planner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings are errors for our own code; third-party deprecation chatter we cannot
# fix from here is ignored by module so it never masks a real warning we emit.
filterwarnings = [
    "error",
    "ignore:The anyio.abc.*:DeprecationWarning",
]
