# Local development and test dependencies.
#
# The test suite runs against a real PostgreSQL server (see backend/tests/conftest.py):
# the schema uses a functional unique index, a DEFERRABLE unique constraint and an
# INET column, none of which SQLite can express.
#
#   docker compose -f deploy/compose.dev.yml up -d db
#
# These credentials are local-only fixtures for a throwaway container. Production
# credentials come from the environment and are never committed.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trip_planner
      POSTGRES_PASSWORD: trip_planner
      POSTGRES_DB: trip_planner_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip_planner"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - trip-planner-dev-db:/var/lib/postgresql/data

volumes:
  trip-planner-dev-db:
